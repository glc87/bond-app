name: Aggiornamento giornaliero bond

on:
  schedule:
    # GitHub non garantisce l'orario dei cron (ritardi di ore, a volte salta): orari non "tondi" e un secondo tentativo.
    # 15:07 UTC = 16:07 ora italiana in inverno (17:07 in estate); 16:37 UTC = 17:37 (18:37) come riserva.
    # Il secondo tentativo viene saltato se i dati di oggi esistono già (step "Già aggiornato oggi?").
    - cron: "7 15 * * 1-5"
    - cron: "37 16 * * 1-5"
  workflow_dispatch:
    inputs:
      limit:
        description: "Numero massimo di titoli (vuoto = tutti)"
        required: false
        default: ""
      segments:
        description: "Segmenti MOT separati da spazio (vuoto = tutti): btp bot cct ctz obbligazioni-euro euro-obbligazioni"
        required: false
        default: ""
      sources:
        description: "Mercati (vuoto = mot tlx): mot, tlx"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-bonds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scraper/requirements.txt

      - name: Già aggiornato oggi?
        id: today
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DONE=$(python -c "import json;m=json.load(open('data/meta.json'));print('yes' if m.get('trade_date')=='$TODAY' and m.get('n_total',0)>1000 else 'no')" 2>/dev/null || echo no)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$DONE" = "yes" ]; then echo "skip=true" >> $GITHUB_OUTPUT; echo "Dati di oggi già presenti: salto."; else echo "skip=false" >> $GITHUB_OUTPUT; fi

      - name: Test offline ed end-to-end (server finto)
        if: steps.today.outputs.skip != 'true'
        run: python scraper/test_offline.py && python scraper/test_e2e.py

      - name: Esegui scraper e calcoli
        if: steps.today.outputs.skip != 'true'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          if [ -n "${{ github.event.inputs.segments }}" ]; then ARGS="$ARGS --segments ${{ github.event.inputs.segments }}"; fi
          if [ -n "${{ github.event.inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          python scraper/run_daily.py --delay 0.5 --workers 2 $ARGS

      - name: Riepilogo
        if: steps.today.outputs.skip != 'true'
        run: |
          echo "## Risultato run" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json; m=json.load(open('data/meta.json'))
          for k in ['trade_date','n_total','n_computable','n_failed','n_with_anomalies','n_tax_not_confirmed','requests','duration_s','price_quality','by_market','n_both_markets','by_kind','by_currency']:
              print(f"- **{k}**: `{m.get(k)}`")
          PY

      - name: Avvisi -> Issue (email)
        if: steps.today.outputs.skip != 'true' && hashFiles('data/alerts_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/alerts_report.md ]; then
            TITLE="Avvisi bond del $(date -u +%Y-%m-%d)"
            gh issue create --title "$TITLE" --body-file data/alerts_report.md --label avvisi 2>/dev/null \
              || gh issue create --title "$TITLE" --body-file data/alerts_report.md
          else
            echo "Nessun avviso scattato"
          fi

      - name: Commit dei dati
        if: steps.today.outputs.skip != 'true'
        run: |
          git config user.name "bond-bot"
          git config user.email "bond-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "data: aggiornamento $(date -u +%Y-%m-%d)"
          # il run dura ~1h: nel frattempo main può essere avanzato (nuovo codice). Riallineo prima di pubblicare.
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "Push fallito dopo 3 tentativi"; exit 1
